# Ops Workstation — tmux
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g status-interval 2
set -g escape-time 0
set -g focus-events on

# Prefix: Ctrl-a (ergonomic; Ctrl-b still common on servers — we document it)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits (current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-ish panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Status — coherent ops look
set -g status-position bottom
set -g status-style "bg=#0b1220,fg=#c8d0e0"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bold,fg=#7ee787] OPS #[fg=#c8d0e0]| #S "
set -g status-right "#[fg=#79c0ff]%Y-%m-%d %H:%M #[fg=#c8d0e0]| #h "
setw -g window-status-current-format "#[bold,fg=#0b1220,bg=#7ee787] #I:#W "
setw -g window-status-format "#[fg=#8b949e] #I:#W "

# Clipboard integration when available
set -g set-clipboard on

# Replaced at install with the fish binary this machine actually has.
# OPS_DEFAULT_SHELL
